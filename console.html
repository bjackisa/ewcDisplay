<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Exploits Worship Centre — Control Room</title>

<!-- Google Fonts: Space Grotesk for numerals/UI, Fraunces for warm editorial labels -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="display.css">       <!-- the design tokens + stage -->
<link rel="stylesheet" href="console.base.css">  <!-- the original form controls -->
<link rel="stylesheet" href="console.css">       <!-- the control-room layout -->
</head>
<body class="console">

<div class="console">

  <header class="console__bar">
    <span class="console__brand">
      <img src="crest.png" alt="">
      <span class="console__brand-text">Exploits Worship Centre<small>Control room</small></span>
    </span>

    <span class="console__link" id="link-status" data-state="waiting">
      <span class="dot"></span><span id="link-status-text">Looking for the display…</span>
    </span>

    <div class="console__bar-actions">
      <button class="btn" id="open-display-btn" title="Open the projection window for the extended screen">Open display window</button>

      <!-- Record, and the transport that only exists while a recording is
           open. Pause/Stop sit between Record and Launch and are hidden until
           the operator starts one; each is an icon, because the icon is the
           whole message. The Record button itself carries the pulsing dot and
           the elapsed / remaining time. -->
      <button class="btn rec-btn" id="record-btn" title="Record the live display to a 4K MP4 on a drive you choose">
        <span class="rec-btn__dot" id="rec-dot" aria-hidden="true"></span>
        <span class="rec-btn__label" id="record-btn-label">Record</span>
      </button>
      <button class="btn icon-btn" id="rec-pause-btn" title="Pause" aria-label="Pause recording" hidden>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.2"/></svg>
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.4 18.2 12 8 18.6Z"/></svg>
      </button>
      <button class="btn icon-btn danger" id="rec-stop-btn" title="Stop" aria-label="Stop recording" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.6" y="6.6" width="10.8" height="10.8" rx="2.2"/></svg>
      </button>

      <!-- Go Live pushes the same display to RTMP (YouTube). Its icon-only Stop
           appears in the same place the recording's transport does, so the top
           bar stays a single row of controls that says everything. -->
      <button class="btn rec-btn live-btn" id="live-btn" title="Stream the live display to RTMP, such as YouTube">
        <span class="rec-btn__dot" id="live-dot" aria-hidden="true"></span>
        <span class="rec-btn__label" id="live-btn-label">Go Live</span>
      </button>
      <button class="btn icon-btn danger" id="live-stop-btn" title="End the stream" aria-label="End the stream" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.6" y="6.6" width="10.8" height="10.8" rx="2.2"/></svg>
      </button>

      <button class="btn primary" id="launch-btn">Launch</button>
    </div>
  </header>

  <div class="console__body">

    <!-- ------------------------------------------------------------------ -->
    <!-- Controls. The same fields the display used to hide behind its gear  -->
    <!-- icon, now permanently in front of the operator. Every change shows  -->
    <!-- in the preview; Launch sends it to the church screen.              -->
    <!-- ------------------------------------------------------------------ -->
    <aside id="settings-panel">

      <!-- AI setup. One key powers verse search, text polish and AI images;
           it is kept in this browser's localStorage and sent only to Google's
           Gemini endpoint. -->
      <details class="ai-setup" id="ai-setup">
        <summary>AI settings</summary>
        <div class="field" style="margin-top:.6rem;">
          <label for="ai-key-input">Gemini API key</label>
          <input type="password" id="ai-key-input" placeholder="Paste your Gemini API key" autocomplete="off">
          <p class="hint" id="ai-key-status"></p>
        </div>
      </details>

      <!-- Go Live settings. The stream key is a secret and stays in this
           browser's localStorage; it is sent only to the RTMP server the
           operator names. -->
      <details class="ai-setup" id="stream-setup">
        <summary>Stream settings</summary>
        <div class="field" style="margin-top:.6rem;">
          <label for="rtmp-url-input">Stream URL</label>
          <input type="text" id="rtmp-url-input" placeholder="rtmp://a.rtmp.youtube.com/live2" autocomplete="off" spellcheck="false">
        </div>
        <div class="field" style="margin-top:.6rem;">
          <label for="rtmp-key-input">Stream key</label>
          <input type="password" id="rtmp-key-input" placeholder="Paste your stream key" autocomplete="off">
        </div>
        <div class="field" style="margin-top:.6rem;">
          <label for="rtmp-backup-input">Backup URL</label>
          <input type="text" id="rtmp-backup-input" placeholder="rtmp://b.rtmp.youtube.com/live2?backup=1" autocomplete="off" spellcheck="false">
        </div>
        <p class="hint" id="rtmp-status"></p>
      </details>

      <hr class="sep">

      <!-- Only the chosen panel's own controls are shown. Everything here is
           preview-only until Launch is pressed. -->
      <div id="mode-fields">

        <div id="timer-fields">
          <div class="field-row">
            <div class="field">
              <label for="event-name-input">Event name</label>
              <input type="text" id="event-name-input" maxlength="60" placeholder="Sunday Service">
            </div>
            <div class="field">
              <label for="target-datetime-input">Date &amp; time</label>
              <input type="datetime-local" id="target-datetime-input">
            </div>
          </div>
          <button class="btn" id="next-sunday-btn" style="margin-top:.8rem;">Set to next Sunday, 9:00 AM</button>
        </div>

        <div id="clock-fields" hidden>
        </div>

        <div id="scripture-fields" hidden>
          <div class="field ai-search">
            <label for="scripture-ai-input">Find a verse</label>
            <div class="ai-search__row">
              <input type="text" id="scripture-ai-input" placeholder="Type anything you know: “God so loved the world”, “Esther 8:9”, “where Jesus calms the storm”…" autocomplete="off">
              <button class="btn primary" id="scripture-ai-btn" title="Find this verse with AI">Find</button>
            </div>
            <p class="hint" id="scripture-ai-status"></p>
          </div>

          <div class="field-row" style="margin-top:.9rem;">
            <div class="field">
              <label for="scripture-book-select">Book</label>
              <select id="scripture-book-select" disabled>
                <option>Loading Bible data…</option>
              </select>
            </div>
            <div class="field">
              <label for="scripture-chapter-input">Chapter</label>
              <input type="number" id="scripture-chapter-input" min="1" step="1" inputmode="numeric">
            </div>
            <div class="field">
              <label for="scripture-verse-input">Verse</label>
              <input type="number" id="scripture-verse-input" min="1" step="1" inputmode="numeric">
            </div>
          </div>
          <div class="file-row" style="margin-top:.8rem;">
            <button class="btn primary" id="scripture-go-btn">Review verse</button>
            <button class="btn" id="choose-scripture-file-btn">Choose en_kjv.json…</button>
          </div>
          <input type="file" id="scripture-file-input" accept="application/json,.json">
          <p class="hint" id="scripture-status" style="margin-top:.6rem;">Loading Bible…</p>
        </div>

        <div id="lyrics-fields" hidden>
          <div class="mode-split">
            <div class="mode-split__col">
              <div class="field">
                <label for="song-search-input">Find a song</label>
                <input type="text" id="song-search-input" placeholder="Search by title…" autocomplete="off">
              </div>

              <div class="field" style="margin-top:1rem;">
                <label>Songs</label>
                <div class="song-list" id="song-list"><!-- built by JS --></div>
              </div>
            </div>

            <div class="mode-split__col">
              <div class="field">
                <label for="song-title-input">Add a song</label>
                <input type="text" id="song-title-input" maxlength="80" placeholder="Song title">
              </div>
              <div class="field" style="margin-top:.7rem;">
                <label for="song-lyrics-input">Lyrics</label>
                <textarea id="song-lyrics-input" placeholder="One line per row — each row shows on its own line."></textarea>
              </div>
              <button class="btn primary" id="song-save-btn" style="margin-top:.8rem;">Save song</button>
              <p class="hint" id="song-status" style="margin-top:.6rem;"></p>
            </div>
          </div>
        </div>

        <div id="text-fields" hidden>
          <div class="field">
            <label for="text-body-input">Text to display</label>
            <div class="ai-textarea">
              <textarea id="text-body-input" placeholder="Type a verse, a quote, an announcement…"></textarea>
              <button type="button" class="ai-polish-btn" id="text-polish-btn" title="Polish this text with AI" aria-label="Polish this text with AI">✦</button>
            </div>
            <p class="hint" id="text-polish-status"></p>
          </div>
          <div class="field" style="margin-top:.7rem;">
            <label for="text-title-input">Title (optional)</label>
            <input type="text" id="text-title-input" maxlength="80" placeholder="e.g. Psalm 23:1">
          </div>
        </div>

        <div id="media-fields" hidden>
          <div class="file-row">
            <button class="btn" id="media-choose-btn">Choose photo / video / GIF / audio…</button>
            <button class="btn" id="media-clear-btn">Remove</button>
          </div>
          <input type="file" id="media-file-input" accept="image/*,video/*,audio/*">

          <div class="field" style="margin-top:.9rem;">
            <label for="media-youtube-input">YouTube video</label>
            <div class="ai-search__row">
              <input type="text" id="media-youtube-input" placeholder="Paste a YouTube video URL…" autocomplete="off">
              <button class="btn" id="media-youtube-btn">Embed</button>
            </div>
          </div>

          <div class="field" style="margin-top:.9rem;">
            <label for="media-ai-prompt">Generate an image with AI</label>
            <div class="ai-search__row">
              <input type="text" id="media-ai-prompt" placeholder="Describe the image you want…" autocomplete="off">
              <button class="btn primary" id="media-ai-btn">Generate</button>
            </div>
          </div>

          <p class="hint" id="media-status"></p>
        </div>

        <div id="camera-fields" hidden>
          <div class="field">
            <label for="camera-device-select">Camera</label>
            <select id="camera-device-select" disabled>
              <option>Looking for cameras…</option>
            </select>
            <p class="hint" id="camera-device-hint"></p>
          </div>
          <div class="file-row" style="margin-top:.8rem;">
            <button class="btn" id="camera-stop-btn">Back to timer panel</button>
          </div>
          <p class="hint" id="camera-status-console"></p>
        </div>

        <div id="webpage-fields" hidden>
          <div class="field">
            <label for="webpage-url-input">Webpage URL</label>
            <div class="ai-search__row">
              <input type="text" id="webpage-url-input" placeholder="https://example.com" autocomplete="off">
              <button class="btn primary" id="webpage-go-btn">Load</button>
            </div>
            <p class="hint" id="webpage-status"></p>
            </div>
        </div>

      </div>

      <p class="hint" id="mode-fields-note" hidden>No Panel is on.</p>

      <hr class="sep">

      <!-- Screen-level, not panel content: whether the glass is shown at all,
           and the photo behind it. -->
      <div class="field">
        <label>No Panel</label>
        <button type="button" id="no-panel-toggle" class="switch" role="switch" aria-checked="false">
          <span class="switch__track"><span class="switch__thumb"></span></span>
          <span class="switch__label">Hide the panel — background only</span>
        </button>
      </div>

      <div class="field" style="margin-top:1rem;">
        <label>Background image</label>
        <div class="file-row">
          <button class="btn" id="choose-image-btn">Choose image…</button>
          <button class="btn" id="clear-image-btn">Remove</button>
        </div>
        <input type="file" id="bg-file-input" accept="image/*">
        <div class="ai-search__row" style="margin-top:.6rem;">
          <input type="text" id="bg-ai-prompt" placeholder="Or describe a background to generate…" autocomplete="off">
          <button class="btn primary" id="bg-ai-btn">Generate</button>
        </div>
        <p class="hint" id="bg-ai-status"></p>
      </div>

      <hr class="sep">

    </aside>

    <!-- ------------------------------------------------------------------ -->
    <!-- Preview. An iframe of display.html — the exact page that goes to    -->
    <!-- the church screen — shrunk to fit. Nothing here reaches the screen  -->
    <!-- until Launch is pressed.                                            -->
    <!-- ------------------------------------------------------------------ -->
    <main class="console__preview">
      <div class="preview-toolbar">
        <span class="preview-toolbar__label">Preview</span>
        <span class="preview-toolbar__hint" id="preview-note" data-state="idle">Not Launched</span>
        <div class="preview-toolbar__steps">
          <button class="btn" id="prev-btn" title="Previous (← or ↑)">‹</button>
          <button class="btn" id="next-btn" title="Next (→ or ↓)">›</button>
        </div>
      </div>

      <div class="preview-frame" id="preview-frame">
        <iframe id="preview" src="display.html?preview=1" title="Display preview"></iframe>
        <!-- Console-only. A transparent sheet over the preview's framed page:
             the operator scrolls and clicks here and the console relays each
             one to the live display, so the page on the church screen follows.
             It never exists on the display itself, which stays untouchable. -->
        <div class="preview-frame__proxy" id="preview-proxy" hidden aria-hidden="true"></div>
      </div>
    </main>

  </div>

  <!-- The panel picker spans the whole window along the bottom edge. It is a
       sibling of the rail/preview row rather than part of the rail, so it
       never scrolls away and never steals height from the controls. -->
  <footer class="console__modes">
    <div class="segmented" id="mode-toggle-group" role="group">
      <button type="button" data-mode="timer" class="active">Countdown timer</button>
      <button type="button" data-mode="clock">Analog clock</button>
      <button type="button" data-mode="scripture">Scripture</button>
      <button type="button" data-mode="lyrics">Lyrics</button>
      <button type="button" data-mode="text">Text</button>
      <button type="button" data-mode="media">Media</button>
      <button type="button" data-mode="camera">Camera</button>
      <button type="button" data-mode="webpage">Webpage</button>
    </div>
  </footer>

  <!-- Console-only notifications. A sandbar slides in, says one short thing,
       and leaves on its own; nothing here needs dismissing, and none of it
       ever reaches the church screen. -->
  <div class="toast-stack" id="toast-stack" role="status" aria-live="polite"></div>

</div>

<script src="display-common.js"></script>
<!-- mp4-muxer (vendored, MIT): the recorder muxes WebCodecs-encoded video into
     a proper MP4 with a seekable sample index, which MediaRecorder cannot
     produce. Vendored so recording works with no network. -->
<script src="vendor/mp4-muxer.js"></script>
<script src="console.js"></script>
</body>
</html>
